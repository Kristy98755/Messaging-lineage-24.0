buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
    }
}

apply plugin: 'com.android.application'

// kotlin-stdlib-jdk7/jdk8 were merged into kotlin-stdlib in Kotlin 1.8.  Some
// dependencies still pull the old split artifacts (1.6.21), which collide with
// kotlin-stdlib 1.8.22 on the release runtime classpath.
allprojects {
    configurations.all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

android {
    compileSdk 34
    namespace 'com.android.messaging'

    defaultConfig {
        applicationId "com.android.messaging"
        minSdk 26
        targetSdk 26
        versionCode 10001040
        versionName "1.0.001"
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        abortOnError false
    }

}

dependencies {
    implementation project(':opt:chips')
    implementation project(':opt:photoviewer')
    implementation project(':opt:vcard')
    implementation project(':opt:colorpicker')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.collection:collection:1.2.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.media:media:1.6.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.13.20'
}
